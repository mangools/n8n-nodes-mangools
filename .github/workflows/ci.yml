name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Fetch, generate, lint, build, pack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch the OpenAPI spec
        run: npm run fetch-spec

      - name: Generate the node operations
        run: npm run generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack
